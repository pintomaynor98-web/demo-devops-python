name: Django CI Pipeline

# Disparadores: Se ejecuta ante cambios en la rama master o en Pull Requests hacia ella
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest # Entorno de ejecución en Linux

    steps:
      # Descarga el código fuente al entorno de ejecución
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Prepara Python y usa caché para que las instalaciones sean rápidas
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Instalación de dependencias y herramientas de QA y Seguridad
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 safety

      # Análisis estático: Detecta errores de sintaxis y verifica estilos
      - name: Static Code Analysis (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 . --count --max-complexity=10 --max-line-length=120 --statistics || true

      # Tests Unitarios: Ejecuta pruebas y genera reporte de cobertura
      - name: Run Unit Tests with Coverage
        env:
          DJANGO_SETTINGS_MODULE: demo.settings
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term || true

      # Escaneo de vulnerabilidades: Verifica si hay librerías inseguras
      - name: Security Scan
        run: |
          safety check || true

      # Login en Docker Hub: Solo si el código está en la rama master/main
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construcción de la imagen: Usa el commit SHA y etiqueta como 'latest'
      - name: Build Docker Image
        if: github.ref == 'refs/heads/master'
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/mi-app-django:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USER }}/mi-app-django:${{ github.sha }} \
                     ${{ secrets.DOCKER_USER }}/mi-app-django:latest

      # Envío al registro: Sube la imagen recién construida
      - name: Push Docker Image
        if: github.ref == 'refs/heads/master'
        run: |
          docker push ${{ secrets.DOCKER_USER }}/mi-app-django:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USER }}/mi-app-django:latest